global
    log stdout format raw local0
    maxconn 2048

defaults
    log global
    mode http
    option httplog
    timeout connect 5s
    timeout client  30s
    timeout server  30s

frontend https_frontend
    bind *:8443
    option forwardfor
    default_backend caddy_cluster

backend caddy_cluster
    balance roundrobin
    option httpchk GET /healthz
    http-check expect status 200
    server node1 caddy-primary:443 check ssl verify none
    server node2 caddy-secondary:443 check ssl verify none backup

frontend jmap_frontend
    bind *:8444
    option forwardfor
    default_backend stalwart_cluster

backend stalwart_cluster
    mode tcp
    balance roundrobin
    option tcp-check
    tcp-check connect port 9090
    server node1 stalwart-primary:8080 check
    server node2 stalwart-secondary:8080 check backup

listen stats
    bind *:8404
    mode http
    stats enable
    stats uri /
    stats refresh 10s

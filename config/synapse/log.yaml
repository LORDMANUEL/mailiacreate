version: 1
formatters:
  precise:
    format: '%(asctime)s - %(name)s - %(levelname)s - %(message)s'
handlers:
  file:
    class: logging.handlers.RotatingFileHandler
    formatter: precise
    filename: /data/homeserver.log
    maxBytes: 10485760
    backupCount: 3
loggers:
  synapse:
    level: INFO
    handlers: [file]
root:
  level: INFO
  handlers: [file]

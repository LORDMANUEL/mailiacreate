global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/rules/mailkit-rules.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ['prometheus:9090']

  - job_name: cadvisor
    static_configs:
      - targets: ['cadvisor:8080']

  - job_name: node-exporter
    static_configs:
      - targets: ['node-exporter:9100']

  - job_name: stalwart
    metrics_path: /metrics
    scheme: http
    static_configs:
      - targets: ['stalwart:9091']

  - job_name: grafana
    metrics_path: /metrics
    static_configs:
      - targets: ['grafana:3000']

  - job_name: send-router
    metrics_path: /metrics
    static_configs:
      - targets: ['send-router:4000']

  - job_name: ai-orchestrator
    metrics_path: /metrics
    static_configs:
      - targets: ['ai-orchestrator:4100']

  - job_name: restic-scheduler
    metrics_path: /metrics
    static_configs:
      - targets: ['restic-scheduler:8000']

  - job_name: synthetic-exporter
    metrics_path: /metrics
    static_configs:
      - targets: ['synthetic-exporter:8090']

  - job_name: matrix-synapse
    metrics_path: /_synapse/metrics
    static_configs:
      - targets: ['synapse:9090']

version: '3'

networks:
  mailkit_net:
    external: true
  jitsi_net:
    internal: true

services:
    # Frontend
    web:
        image: jitsi/web
        ports:
            - '${HTTP_PORT}:80'
            - '${HTTPS_PORT}:443'
        volumes:
            - '${CONFIG}/web:/config:Z'
            - '${CONFIG}/transcripts:/usr/share/jitsi-meet/transcripts:Z'
        environment:
            - JICOFO_AUTH_USER
            - XMPP_DOMAIN
            - XMPP_AUTH_DOMAIN
            - XMPP_BOSH_ROOT
            - XMPP_MUC_DOMAIN
            - XMPP_INTERNAL_MUC_DOMAIN
            - XMPP_GUEST_DOMAIN
            - XMPP_RECORDER_DOMAIN
            - ETHERPAD_URL_BASE
            - PUBLIC_URL
            - JIBRI_BREWERY_MUC
            - JIBRI_PENDING_TIMEOUT
            - JIBRI_STRIP_FROM_NODE_ID
            - JIBRI_XMPP_USER
            - JIBRI_XMPP_PASSWORD
            - JIBRI_RECORDER_USER
            - JIBRI_RECORDER_PASSWORD
            - TZ
        networks:
            - mailkit_net
            - jitsi_net

    # XMPP server
    prosody:
        image: jitsi/prosody
        expose:
            - '5222'
            - '5347'
            - '5280'
        volumes:
            - '${CONFIG}/prosody/config:/config:Z'
            - '${CONFIG}/prosody/prosody-plugins-custom:/prosody-plugins-custom:Z'
        environment:
            - XMPP_DOMAIN
            - XMPP_AUTH_DOMAIN
            - XMPP_MUC_DOMAIN
            - XMPP_INTERNAL_MUC_DOMAIN
            - XMPP_MODULES
            - XMPP_MUC_MODULES
            - XMPP_GUEST_DOMAIN
            - JICOFO_COMPONENT_SECRET
            - JICOFO_AUTH_USER
            - JICOFO_AUTH_PASSWORD
            - JVB_AUTH_USER
            - JVB_AUTH_PASSWORD
            - JIBRI_XMPP_USER
            - JIBRI_XMPP_PASSWORD
            - JIBRI_RECORDER_USER
            - JIBRI_RECORDER_PASSWORD
            - LDAP_URL
            - LDAP_BASE
            - LDAP_BINDDN
            - LDAP_BINDPW
            - LDAP_FILTER
            - LDAP_AUTH_METHOD
            - LDAP_VERSION
            - LDAP_USE_TLS
            - LDAP_TLS_CACERT_FILE
            - LDAP_TLS_CHECK_PEER
            - GLOBAL_MODULES
            - GLOBAL_CONFIG
            - TZ
            - ENABLE_AUTH
            - ENABLE_GUESTS
            - AUTH_TYPE
        networks:
            - jitsi_net

    # Focus component
    jicofo:
        image: jitsi/jicofo
        volumes:
            - '${CONFIG}/jicofo:/config:Z'
        environment:
            - XMPP_DOMAIN
            - XMPP_SERVER
            - XMPP_PORT
            - XMPP_AUTH_DOMAIN
            - XMPP_MUC_DOMAIN
            - XMPP_INTERNAL_MUC_DOMAIN
            - JICOFO_COMPONENT_SECRET
            - JICOFO_AUTH_USER
            - JICOFO_AUTH_PASSWORD
            - JVB_BREWERY_MUC
            - JIBRI_BREWERY_MUC
            - TZ
            - ENABLE_AUTH
            - AUTH_TYPE
            - JICOFO_AUTH_LIFETIME
            - JICOFO_MAX_SSRC_PER_USER
        depends_on:
            - prosody
        networks:
            - jitsi_net

    # Video bridge
    jvb:
        image: jitsi/jvb
        ports:
            - '${JVB_PORT}:${JVB_PORT}/udp'
            - '${JVB_TCP_PORT}:${JVB_TCP_PORT}'
        volumes:
            - '${CONFIG}/jvb:/config:Z'
        environment:
            - DOCKER_HOST_ADDRESS
            - XMPP_DOMAIN
            - XMPP_AUTH_DOMAIN
            - XMPP_INTERNAL_MUC_DOMAIN
            - XMPP_SERVER
            - JVB_AUTH_USER
            - JVB_AUTH_PASSWORD
            - JVB_STUN_SERVERS
            - JVB_PORT
            - JVB_TCP_HARVESTER_DISABLED
            - JVB_TCP_PORT
            - JVB_VIDEOCHANNEL_MAX_FRAME_HEIGHT
            - TZ
        depends_on:
            - prosody
        networks:
            - jitsi_net

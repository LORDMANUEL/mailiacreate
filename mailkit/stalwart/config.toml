# Stalwart Mail Server configuration file.
# See https://stalwart.at/docs/configuration for more information.

[server]
hostname = "mail.tudominio.com"

[data]
directory = "/data"

[[session]]
protocol = "jmap"
port = 8080
threads = 16

  [session.tls]
  port = 8443
  key = "/data/tls/private.key"
  cert = "/data/tls/certificate.crt"

[[session]]
protocol = "smtp"
port = 25
threads = 16

  [session.tls]
  port = 465
  key = "/data/tls/private.key"
  cert = "/data/tls/certificate.crt"

  [session.auth.plain]
  method = "plain"

[[session]]
protocol = "imap"
port = 143
threads = 16

  [session.tls]
  port = 993
  key = "/data/tls/private.key"
  cert = "/data/tls/certificate.crt"

[[resolver]]
name = "trusted"
allow-domains = ["tudominio.com"]

[[store]]
name = "default"
backend = "rocksdb"
path = "/data/storage"

[[blob]]
name = "default"
backend = "rocksdb"
path = "/data/blob"

[[lookup]]
name = "default"
backend = "rocksdb"
path = "/data/lookup"

# DKIM configuration
# To generate a DKIM key, run the following command:
# openssl genrsa -out dkim_private.key 2048
# openssl rsa -in dkim_private.key -pubout -out dkim_public.key
#
# Then, add the public key to your DNS records as a TXT record.
# The record name should be `default._domainkey.tudominio.com`.
# The value should be `v=DKIM1; k=rsa; p=<your_public_key>`.
#
[[dkim]]
name = "default"
selector = "default"
domain = "tudominio.com"
private-key-path = "/data/dkim/private.key"

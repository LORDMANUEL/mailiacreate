# Stalwart Mail Server - File-based Accounts
# This file defines the users for the mail server.
#
# IMPORTANT: Passwords must be hashed using the Stalwart CLI.
# To generate a password hash, run the following command and replace the placeholder:
# sudo docker compose -f mailkit/docker-compose.prod.yml run --rm stalwart manage password
#

[[account]]
name = "jules"
description = "Jules (Admin User)"
emails = ["jules@${DOMAIN}"]
# Replace the secret below with the hash generated by the 'manage password' command.
secret = "PLACEHOLDER_PASSWORD_HASH"
quota = 1073741824 # 1 GB
permissions = [
  "admin:all" # Grant all administrative permissions to this user.
]
